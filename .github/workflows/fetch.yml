---
name: Fetch YT Music History

on:
  # Due to unstable scheduler for free accounts and significant delays, this job
  # is running on schedule via cron-job.org instead of "schedule" trigger.
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: sh

jobs:
  fetch:
    name: Fetch
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: "pyproject.toml"

      - name: Install dependencies
        run: make install

      - name: Write browser.json from secret
        uses: pyTooling/Actions/with-post-step@5c6a1aec0bb5a0243ad0c6f98a8e1258c019e679 # v9.3.3
        env:
          YTM_BROWSER: "${{ secrets.YTM_BROWSER }}"
        with:
          main: echo "${YTM_BROWSER}" > browser.json
          post: rm -f browser.json

      - name: Fetch history
        env:
          NEON_DATABASE_URL: "${{ secrets.NEON_DATABASE_URL }}"
        run: make fetch
