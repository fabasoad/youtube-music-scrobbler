---
name: Fetch YT Music History

on:
  # Due to unstable scheduler for free accounts and significant delays, this job
  # is running on schedule via cron-job.org instead of "schedule" trigger.
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: sh

jobs:
  fetch:
    name: Fetch
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version-file: "pyproject.toml"

      - name: Install dependencies
        run: make install

      - name: Write browser.json from secret
        uses: pyTooling/Actions/with-post-step@6f3d6d20558fd3891554da44666a148767e33a67 # v7.15.0
        env:
          YTM_BROWSER: "${{ secrets.YTM_BROWSER }}"
        with:
          main: echo "${YTM_BROWSER}" > browser.json
          post: rm -f browser.json

      - name: Fetch history
        env:
          NEON_DATABASE_URL: "${{ secrets.NEON_DATABASE_URL }}"
        run: make fetch
