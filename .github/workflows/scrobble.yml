---
name: Scrobble YT Music History

on:
  workflow_run:
    workflows: ["Fetch YT Music History"]
    types: [completed]

permissions:
  contents: write

defaults:
  run:
    shell: sh

jobs:
  scrobble:
    name: Scrobble
    runs-on: [ubuntu-latest]
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Get GitHub token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: github-app
        with:
          client-id: ${{ secrets.GH_APP_CONTENTS_CRUD_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_CONTENTS_CRUD_PRIVATE_KEY }}

      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@v7
        with:
          token: "${{ steps.github-app.outputs.token }}"
          persist-credentials: "true"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version-file: "pyproject.toml"

      - name: Install dependencies
        run: make install

      - name: Run scrobble script
        env:
          NEON_DATABASE_URL: "${{ secrets.NEON_DATABASE_URL }}"
          LASTFM_API_KEY: "${{ secrets.LASTFM_API_KEY }}"
          LASTFM_SECRET: "${{ secrets.LASTFM_SECRET }}"
          LASTFM_USERNAME: "${{ secrets.LASTFM_USERNAME }}"
          LASTFM_PASSWORD: "${{ secrets.LASTFM_PASSWORD }}"
          LISTENBRAINZ_USERNAME: "${{ secrets.LISTENBRAINZ_USERNAME }}"
          LISTENBRAINZ_TOKEN: "${{ secrets.LISTENBRAINZ_TOKEN }}"
        run: make run

      - name: Setup git config
        env:
          GH_TOKEN: "${{ steps.github-app.outputs.token }}"
          STEPS_APP_TOKEN_OUTPUTS_APP_SLUG: ${{ steps.github-app.outputs.app-slug }}
        run: |
          user_name="${STEPS_APP_TOKEN_OUTPUTS_APP_SLUG}[bot]"
          user_id="$(gh api "/users/${user_name}" --jq .id)"
          git config user.email "${user_id}+${user_name}@users.noreply.github.com"
          git config user.name "${user_name}"

      - name: Commit updated snapshot and log
        run: |
          git add runs.log
          git diff --staged --quiet || git commit -m "chore: update snapshot"
          git push
