---
name: Scrobble YT Music History

on:
  # Due to unstable scheduler for free accounts and significant delays, this job
  # is running on schedule via cron-job.org instead of "schedule" trigger.
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    shell: sh

jobs:
  scrobble:
    name: Scrobble
    runs-on: [ubuntu-latest]
    steps:
      - name: Get GitHub token
        uses: actions/create-github-app-token@v3
        id: github-app
        with:
          app-id: ${{ vars.GH_APP_CONTENTS_CRUD_APP_ID }}
          private-key: ${{ secrets.GH_APP_CONTENTS_CRUD_PRIVATE_KEY }}

      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@v7
        with:
          token: "${{ steps.github-app.outputs.token }}"
          persist-credentials: "true"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version-file: "pyproject.toml"

      - name: Install dependencies
        run: make install

      - name: Write browser.json from secret
        uses: pyTooling/Actions/with-post-step@6f3d6d20558fd3891554da44666a148767e33a67 # v7.15.0
        env:
          YTM_BROWSER: "${{ secrets.YTM_BROWSER }}"
        with:
          main: echo "${YTM_BROWSER}" > browser.json
          post: rm -f browser.json

      - name: Run scrobble script
        env:
          LASTFM_API_KEY: "${{ secrets.LASTFM_API_KEY }}"
          LASTFM_SECRET: "${{ secrets.LASTFM_SECRET }}"
          LASTFM_USERNAME: "${{ secrets.LASTFM_USERNAME }}"
          LASTFM_PASSWORD: "${{ secrets.LASTFM_PASSWORD }}"
          LISTENBRAINZ_TOKEN: "${{ secrets.LISTENBRAINZ_TOKEN }}"
        run: make run

      - name: Setup git config
        env:
          GH_TOKEN: "${{ steps.github-app.outputs.token }}"
          STEPS_APP_TOKEN_OUTPUTS_APP_SLUG: ${{ steps.github-app.outputs.app-slug }}
        run: |
          user_name="${STEPS_APP_TOKEN_OUTPUTS_APP_SLUG}[bot]"
          user_id="$(gh api "/users/${user_name}" --jq .id)"
          git config user.email "${user_id}+${user_name}@users.noreply.github.com"
          git config user.name "${user_name}"

      - name: Commit updated snapshot and log
        run: |
          git add last_snapshot.json runs.log
          git diff --staged --quiet || git commit -m "chore: update snapshot"
          git push
