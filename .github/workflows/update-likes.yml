---
name: Update Likes

on:
  workflow_run:
    workflows: ["Fetch YT Music History"]
    types: [completed]

permissions:
  contents: read

defaults:
  run:
    shell: sh

jobs:
  update-likes:
    name: Update Likes
    runs-on: [ubuntu-latest]
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version-file: "pyproject.toml"

      - name: Install dependencies
        run: make install

      - name: Write browser.json from secret
        uses: pyTooling/Actions/with-post-step@6f3d6d20558fd3891554da44666a148767e33a67 # v7.15.0
        env:
          YTM_BROWSER: "${{ secrets.YTM_BROWSER }}"
        with:
          main: echo "${YTM_BROWSER}" > browser.json
          post: rm -f browser.json

      - name: Update like status
        env:
          LASTFM_API_KEY: "${{ secrets.LASTFM_API_KEY }}"
          LASTFM_SECRET: "${{ secrets.LASTFM_SECRET }}"
          LASTFM_USERNAME: "${{ secrets.LASTFM_USERNAME }}"
          LASTFM_PASSWORD: "${{ secrets.LASTFM_PASSWORD }}"
          LISTENBRAINZ_USERNAME: "${{ secrets.LISTENBRAINZ_USERNAME }}"
          LISTENBRAINZ_TOKEN: "${{ secrets.LISTENBRAINZ_TOKEN }}"
        run: make update-likes
