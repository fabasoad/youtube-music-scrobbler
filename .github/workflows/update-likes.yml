---
name: Update Likes

on:
  workflow_run:
    workflows: ["Fetch YT Music History"]
    types: [completed]

permissions:
  contents: read

defaults:
  run:
    shell: sh

jobs:
  update-likes:
    name: Update Likes
    runs-on: [ubuntu-latest]
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: "pyproject.toml"

      - name: Install dependencies
        run: make install

      - name: Write browser.json from secret
        uses: pyTooling/Actions/with-post-step@5c6a1aec0bb5a0243ad0c6f98a8e1258c019e679 # v9.3.3
        env:
          YTM_BROWSER: "${{ secrets.YTM_BROWSER }}"
        with:
          main: echo "${YTM_BROWSER}" > browser.json
          post: rm -f browser.json

      - name: Update like status
        env:
          LASTFM_API_KEY: "${{ secrets.LASTFM_API_KEY }}"
          LASTFM_SECRET: "${{ secrets.LASTFM_SECRET }}"
          LASTFM_USERNAME: "${{ secrets.LASTFM_USERNAME }}"
          LASTFM_PASSWORD: "${{ secrets.LASTFM_PASSWORD }}"
          LISTENBRAINZ_USERNAME: "${{ secrets.LISTENBRAINZ_USERNAME }}"
          LISTENBRAINZ_TOKEN: "${{ secrets.LISTENBRAINZ_TOKEN }}"
        run: make update-likes
