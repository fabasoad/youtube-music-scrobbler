[project]
name = "youtube-music-scrobbler"
version = "0.1.0"
description = "Automatically scrobbles your YouTube Music listening history to Last.fm"
requires-python = ">=3.14"
dependencies = [
  "pylast==7.1.0",
  "liblistenbrainz>=0.7.0",
  "ytmusicapi==1.12.2",
  "loguru>=0.7.3",
  "psycopg[binary]>=3.2.0",
]

[project.scripts]
scrobble = "scrobble.main:main"
fetch = "scrobble.fetch:main"
update-likes = "scrobble.main_update_likes:main"
refresh-auth = "scrobble.auth:main"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.2",
]

[tool.uv]
required-version = ">=0.11.28"
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrobble"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 110
indent-width = 2
exclude = ["CLAUDE.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
